name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE_NAME: final-dm-dos35

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -cover

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push image to ECR
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}
          docker build -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-west-1 --name final-project

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/final-golang \
            app=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl rollout status deployment final-golang --timeout=180s

 
 # уведомление (ВСЕГДА) ============
  notify:
    needs: [build-and-test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📦 ${{ github.repository }}
            🔀 Ветка: ${{ github.ref_name }}
            💬 Коммит: ${{ github.event.head_commit.message }}
            🧪 Сборка/тесты: ${{ needs.build-and-test.result }}
            🚀 Деплой: ${{ needs.deploy.result }}
