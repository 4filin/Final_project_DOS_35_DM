---
# ============================================================
# Play 1: Docker + docker compose на ВСЕХ серверах проекта
# ============================================================
- name: Base setup on all project servers
  hosts: all
  become: true

  tasks:
    - name: Install Docker
      dnf:
        name: docker
        state: present
        update_only: no

    - name: Start docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Ensure docker cli-plugins directory exists
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Install docker compose plugin
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"
        force: no

# ============================================================
# Play 2: мониторинг-нода (nginx-фронт + Prometheus/Grafana)
# ============================================================
- name: Configure monitoring server
  hosts: final_project_app
  become: true

  tasks:
    - name: Install nginx
      dnf:
        name: nginx
        state: present

    - name: Configure nginx as reverse proxy to EKS nodes
      copy:
        dest: /etc/nginx/conf.d/app_proxy.conf
        content: |
          upstream app_backend {
              server 10.1.1.141:30080;
              server 100.23.74.208:30080;
          }
          server {
              listen 80;
              location / {
                  proxy_pass http://app_backend;
                  proxy_set_header Host $host;
              }
          }
      notify: Restart nginx

    - name: Create monitoring directory
      file:
        path: /opt/app/monitoring
        state: directory

    - name: Copy monitoring stack files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: "{{ playbook_dir }}/../docker-compose.yml", dest: "/opt/app/docker-compose.yml" }
        - { src: "{{ playbook_dir }}/../monitoring/prometheus.yml", dest: "/opt/app/monitoring/prometheus.yml" }

    - name: Start monitoring stack
      command: docker compose up -d
      args:
        chdir: /opt/app

    - name: Start nginx
      systemd:
        name: nginx
        enabled: yes
        state: started

  handlers:
    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted

# ============================================================
# Play 3: ELK-нода (Elasticsearch + Kibana)
# ============================================================
- name: Configure ELK server
  hosts: final_project_elk
  become: true

  tasks:
    - name: Create elk directory
      file:
        path: /opt/elk
        state: directory

    - name: Copy ELK compose file
      copy:
        src: "{{ playbook_dir }}/../monitoring/docker-compose.elk.yml"
        dest: "/opt/elk/docker-compose.yml"

    - name: Start ELK stack
      command: docker compose up -d
      args:
        chdir: /opt/elk